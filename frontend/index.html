<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connections - Knowledge Graph</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div class="container mx-auto px-4 py-8 max-w-6xl">
        <!-- Header -->
        <header class="mb-8">
            <h1 class="text-4xl font-bold text-gray-900 mb-2">Connections</h1>
            <p class="text-gray-600">Knowledge Graph for themultiverse.school</p>
            <p class="text-sm text-gray-500 mt-2">
                API Docs: <a href="/docs" class="text-blue-600 hover:underline">/docs</a>
            </p>
        </header>

        <!-- Create Entity Section -->
        <section class="bg-white rounded-lg shadow p-6 mb-6">
            <h2 class="text-2xl font-semibold mb-4">Create Entity</h2>
            <form id="createEntityForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        Types (comma-separated)
                    </label>
                    <input
                        type="text"
                        id="entityTypes"
                        placeholder="Concept, Resource"
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                    />
                    <p class="text-xs text-gray-500 mt-1">e.g., "Concept" or "Resource, Video"</p>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        Properties (JSON)
                    </label>
                    <textarea
                        id="entityProperties"
                        rows="4"
                        placeholder='{"name": "Python Async", "definition": "..."}'
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono text-sm"
                    ></textarea>
                    <p class="text-xs text-gray-500 mt-1">Valid JSON object</p>
                </div>
                <button
                    type="submit"
                    class="bg-blue-600 text-white px-6 py-2 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
                >
                    Create Entity
                </button>
            </form>
            <div id="entityResult" class="mt-4"></div>
        </section>

        <!-- List Entities Section -->
        <section class="bg-white rounded-lg shadow p-6 mb-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-semibold">Entities</h2>
                <div class="flex gap-2">
                    <input
                        type="text"
                        id="filterTypes"
                        placeholder="Filter by type..."
                        class="px-3 py-1 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                    />
                    <button
                        onclick="loadEntities()"
                        class="bg-gray-600 text-white px-4 py-1 text-sm rounded-md hover:bg-gray-700"
                    >
                        Refresh
                    </button>
                </div>
            </div>
            <div id="entitiesList" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <p class="text-gray-500 text-sm">Loading entities...</p>
            </div>
        </section>

        <!-- Create Relation Section -->
        <section class="bg-white rounded-lg shadow p-6 mb-6">
            <h2 class="text-2xl font-semibold mb-4">Create Relation</h2>
            <form id="createRelationForm" class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">
                            From Entity ID
                        </label>
                        <input
                            type="text"
                            id="fromEntity"
                            placeholder="UUID"
                            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono text-sm"
                        />
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">
                            To Entity ID
                        </label>
                        <input
                            type="text"
                            id="toEntity"
                            placeholder="UUID"
                            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono text-sm"
                        />
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        Relation Type
                    </label>
                    <input
                        type="text"
                        id="relationType"
                        placeholder="EXEMPLIFIES, REQUIRES, IS_A, etc."
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                    />
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        Properties (JSON, optional)
                    </label>
                    <textarea
                        id="relationProperties"
                        rows="2"
                        placeholder='{"strength": 0.9, "rationale": "..."}'
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono text-sm"
                    ></textarea>
                </div>
                <button
                    type="submit"
                    class="bg-green-600 text-white px-6 py-2 rounded-md hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-500"
                >
                    Create Relation
                </button>
            </form>
            <div id="relationResult" class="mt-4"></div>
        </section>

        <!-- View Entity Details (appears when clicking an entity) -->
        <section id="entityDetails" class="bg-white rounded-lg shadow p-6 hidden">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-semibold">Entity Details</h2>
                <button
                    onclick="closeEntityDetails()"
                    class="text-gray-500 hover:text-gray-700"
                >
                    ✕ Close
                </button>
            </div>
            <div id="entityDetailsContent"></div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
